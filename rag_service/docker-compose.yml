services:
  rag-api:
    build: .
    container_name: support_copilot_rag_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/support_copilot
      CHROMA_DB_PATH: /app/chroma_db
      UPLOAD_DIR: /app/uploads
      HF_HOME: /home/app/.cache/huggingface
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      TOP_K: ${TOP_K:-3}
      APP_NAME: ${APP_NAME:-AI Customer Support Copilot RAG Service}
      ENV: ${ENV:-development}
      API_KEY_AUTH_ENABLED: ${API_KEY_AUTH_ENABLED:-true}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      INTERNAL_ALLOWED_ACCESS_LEVELS: ${INTERNAL_ALLOWED_ACCESS_LEVELS:-support,public}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      RERANKING_ENABLED: ${RERANKING_ENABLED:-false}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANK_CANDIDATE_MULTIPLIER: ${RERANK_CANDIDATE_MULTIPLIER:-5}
      RERANK_MAX_CANDIDATES: ${RERANK_MAX_CANDIDATES:-25}
      RAGAS_DATASET_PATH: ${RAGAS_DATASET_PATH:-./evals/datasets/support_eval_v1.json}
      RAGAS_AUTO_EVAL_ENABLED: ${RAGAS_AUTO_EVAL_ENABLED:-true}
      RAGAS_EVALUATOR_MODEL: ${RAGAS_EVALUATOR_MODEL:-}
      RAGAS_EVALUATOR_PROVIDER: ${RAGAS_EVALUATOR_PROVIDER:-}
      RAGAS_EVALUATOR_API_KEY: ${RAGAS_EVALUATOR_API_KEY:-}
      RAGAS_EVALUATOR_BASE_URL: ${RAGAS_EVALUATOR_BASE_URL:-}
      RAGAS_EVALUATOR_MAX_TOKENS: ${RAGAS_EVALUATOR_MAX_TOKENS:-2048}
      RAGAS_PROMPT_VERSION: ${RAGAS_PROMPT_VERSION:-rag_prompt_v1}
      RAGAS_RETRIEVAL_VERSION: ${RAGAS_RETRIEVAL_VERSION:-chroma_v1}
      RAGAS_EVAL_TOP_K: ${RAGAS_EVAL_TOP_K:-5}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - model_cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: support_copilot_postgres
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
  model_cache:
