services:
  rag-api:
    build: .
    container_name: support_copilot_rag_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/support_copilot
      CHROMA_DB_PATH: /app/chroma_db
      UPLOAD_DIR: /app/uploads
      HF_HOME: /home/app/.cache/huggingface
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      TOP_K: ${TOP_K:-3}
      APP_NAME: ${APP_NAME:-AI Customer Support Copilot RAG Service}
      ENV: ${ENV:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env before starting rag-api}
      INTERNAL_ALLOWED_ACCESS_LEVELS: ${INTERNAL_ALLOWED_ACCESS_LEVELS:-support,public}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - model_cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: support_copilot_postgres
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
  model_cache:
